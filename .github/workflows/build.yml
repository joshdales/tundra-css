name: Build Check

on:
  push:
    paths:
      - "packages/tundra/*"
      - "packages/tundra/index.scss"
      - "packages/tundra/styles/*"
  pull_request:
    paths:
      - "packages/tundra/index.scss"
      - "packges/tundra/styles/*"

jobs:
  build-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@lts
          cache: true
      - run: pnpm build
      - name: Check if CSS is up to date
        run: |
          if ! git diff --quiet index.css; then
            echo "The index.css has changes after running the build command. Please commit those changes."
            exit 1
          fi
